# Plasma Login Manager remote access
# Set a feature to 0 to disable it.

PLASMALOGIN_REMOTE_RDP=1
PLASMALOGIN_REMOTE_RDP_PORT=3389
# RDP authenticates normal system users through PAM (any local account + its password).
# Stream only this monitor index (the physical screen), so the VNC virtual
# monitor is not duplicated into the RDP view.
PLASMALOGIN_REMOTE_RDP_MONITOR=0
# SharedAccess streams the existing login screen.
# AdditionalDisplay creates a virtual monitor for every RDP client.
PLASMALOGIN_REMOTE_RDP_MODE=SharedAccess

PLASMALOGIN_REMOTE_VNC=1
PLASMALOGIN_REMOTE_VNC_PORT=5900
PLASMALOGIN_REMOTE_VNC_PASSWORD=ChangeMeNow
PLASMALOGIN_REMOTE_VNC_RESOLUTION=1920x1080

PLASMALOGIN_REMOTE_SUNSHINE=0
